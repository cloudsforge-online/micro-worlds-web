# Forge Worlds' server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. That makes a "page not found" screen a success: search engines index
# it, uptime checks call it healthy, link checkers pass, and a deploy that drops a route looks
# exactly like a deploy that did not.
#
# It matters on this surface because `/titles/<uuid>` is a PUBLIC, shareable address — both routes
# behind it make no `authenticate()` call — and a mistyped one answering 200 is a page somebody can
# be sent to and believe.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list and `ROUTES` in src/lib/routes.ts must agree. That is one line per
# route, paid once per route, and `test/routes.test.ts` reads this file and fails the build when
# they drift. "Remember to update nginx.conf" is not a mechanism; a test is.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ────────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it —
# this file is installed as /etc/nginx/conf.d/default.conf (Dockerfile), which is included in http,
# so this is legal here and would not be legal ten lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui, and test/sitemap.test.ts reads that export and
# fails if this alternation has drifted from it. They are the words that name an environment rather
# than a surface: `surfaces.ts` reserves them so that no surface may take one as a subdomain, and
# `deploy/scripts/check-apex-prefix.py` enforces that.
#
# `(?:[^.]+-)?` catches BOTH shapes, and both are real. The environment is a SUFFIX on the first
# label now — `worlds-testnet.<apex>` — and was an apex prefix before — `testnet.<apex>`, which put
# this surface at the two-label `worlds.testnet.<apex>`, unreachable because Cloudflare's Universal
# SSL is a one-label wildcard and every two-label name fails the handshake at the edge.
# `surfaces.ts` keeps the old shape deliberately, so both have to match or half the estate stays
# indexable on testnet.
#
# ── WHAT IT IS FOR, ON THIS SURFACE IN PARTICULAR ──────────────────────────────────────────────
#
# A testnet estate carries test EMBER, a faucet and a registry deliberately full of half-built
# titles. Indexed beside the real one, its title pages are pages a player could believe describe a
# game they can buy something for — and this product's whole job is to say what a purchase really
# turns into. That is a support problem before it is an SEO problem. So a non-mainnet environment
# answers `Disallow: /` and serves no sitemap.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # SAMEORIGIN rather than DENY: this is a public product surface with legitimate same-origin
    # embeds inside Hub, unlike the operator console, which has none and uses DENY.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /worlds/assets/ {
        try_files $uri =404;
        # REPEATED, NOT INHERITED. nginx's `add_header` is all-or-nothing per level: a location
        # that declares ANY add_header inherits NONE from its parent. So every location below that
        # sets Cache-Control must restate the security headers, or it silently serves without them
        # — which is exactly what `location /assets/` did in the template, stripping nosniff from
        # every hashed script in every frontend cut from it.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- the generated art ------------------------------------------------
    # The sixteen heraldry pieces a sealed season's rank banner is composed from, copied out of
    # micro-aetherholm-assets by tools/sync-heraldry.mjs, plus the provenance manifest served
    # beside them. Vite copies public/ into dist/ verbatim, so these are served as themselves
    # rather than hashed into the bundle — which is what makes them immutable-cacheable and what
    # lets src/art/heraldry.ts name them by a stable path.
    #
    # Immutable for a stronger reason than the hashed bundle's: these files are content-addressed
    # by what they ARE — the picture of a gold laurel is that picture — so changing one is changing
    # the asset set, which ships as a new image.
    #
    # A MISSING ONE MUST 404 ON ITS OWN TERMS. Without this block a request for a picture that is
    # not there falls to `error_page 404 /index.html` below and comes back as the app shell with a
    # 200: the <img> then fails to decode with no status to explain it, and — worse — anything
    # probing the URL is told the file is fine. That is the shape of the defect this whole change
    # exists to close (micro-org#185, #175, #173).
    #
    # A prefix location rather than an alternation, deliberately: the ONE regex `location ~ ^/(…)`
    # block below is the enumerated route list and test/routes.test.ts finds it by that shape. A
    # second regex would be matched first and the route check would then be reading the wrong list
    # — and passing.
    location /worlds/art/ {
        try_files $uri =404;
        # Repeated, not inherited. See the note in `location /assets/` above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    location = /worlds/index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts. test/routes.test.ts reads both.
    # BOTH SPELLINGS. `/worlds/` is an address this surface did not used to have: the 301 from the
    # retired hostname lands on it, and so does any link that carries a trailing slash.
    location = /worlds/ {
        try_files /worlds/index.html =404;
        # `try_files` is a FILE LOOKUP, not an internal redirect, so serving /index.html here does
        # NOT re-enter `location = /index.html` above — and this location therefore has to declare
        # the shell's no-store itself. Without it `/` shipped with no Cache-Control at all, which
        # is the one document that must never be cached: it names the hashed bundle.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    location = /worlds {
        try_files /worlds/index.html =404;
        # `try_files` is a FILE LOOKUP, not an internal redirect, so serving /index.html here does
        # NOT re-enter `location = /index.html` above — and this location therefore has to declare
        # the shell's no-store itself. Without it `/` shipped with no Cache-Control at all, which
        # is the one document that must never be cached: it names the hashed bundle.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/worlds/(player|inventory|entitlements|titles|play)(/|$) {
        try_files /worlds/index.html =404;
        # Same reason as `location = /` above: try_files does not re-enter, so restate them all.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the sitemap and robots.txt, emitted with $host -------------------
    #
    # THEY ARE HERE RATHER THAN IN public/ FOR THE ONE REASON THAT DECIDES IT: a sitemap must carry
    # ABSOLUTE URLs — the spec requires it and a crawler discards a relative `<loc>` — and nothing
    # built in this repository is allowed to name a hostname, because one image is served from
    # localhost, from a preview deployment and from `worlds.<apex>`
    # (test/no-build-time-config.test.ts is that rule, and the CI step beside it). nginx is the
    # component that knows: it has `$host` on every request, so the addresses are composed per
    # request and the artefact stays environment-free.
    #
    # ── WHY THIS IS NOT `sitemapXml()` FROM @cloudsforge/ui ────────────────────────────────────
    #
    # THIS SURFACE IS NOT THE APEX. The shared generator composes every sibling as
    # `<subdomain>.$host`, which is exactly right on the marketing site, where `$host` IS the apex.
    # Here `$host` is already `worlds.<apex>`, so the same generator would emit
    # `network.worlds.<apex>` — a two-label hostname that resolves to nothing and cannot complete a
    # TLS handshake against the edge's one-label wildcard. A sitemap of addresses that cannot be
    # connected to is worse than no sitemap: a crawler handed dead URLs by a site's own index
    # discounts the ones that work.
    #
    # So this surface lists ITS OWN public routes and nothing else, and the estate sitemap stays
    # the apex's job. `test/sitemap.test.ts` checks both halves against `SITEMAP_PATHS` in
    # src/lib/meta.ts, which is derived from `ROUTES` — the same declaration the navigation, the
    # router and the enumerated locations above all come from.
    #
    # ── WHICH IS ONE ADDRESS, AND WHY THE OTHER PUBLIC ROUTE IS NOT IN IT ──────────────────────
    #
    # `/` — the platform page. Public because `GET /v1/titles` is public.
    #
    # `/titles/<uuid>` IS PUBLIC AND IS DELIBERATELY ABSENT. It is the address this surface most
    # wants read — both routes behind it make no `authenticate()` call — but the set is UNBOUNDED
    # and knowable only to the service: one address per registered title, minted by
    # `POST /v1/titles`. A static list here would be a second opinion about which titles exist,
    # stale the moment one is registered, and empty today. They are discovered from `/`, which IS
    # the list of them. Bare `/titles` is not a destination either — the router has `titles/:id` and
    # nothing else, so the address renders the not-found page; this location block serves it a shell
    # because the segment matches, and a sitemap entry for it would be a promise this file cannot
    # keep.
    #
    # `/player`, `/inventory` and `/entitlements` are absent for the plainer reason: they are gated,
    # and a crawler following one reaches a redirect to sign in. `pageMetaFor` in src/lib/meta.ts
    # sends `noindex` for exactly the same three, which is the same decision made twice on purpose
    # — a sitemap is an invitation and a robots directive is an instruction, and the two must not
    # disagree.
    location = /worlds/sitemap.xml {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the `.xml` in the URI to `text/xml` from its own table and the
        # `default_type` line is inert — a declaration that reads as a decision and is not one.
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        # Restated in full, for the reason `location /assets/` above already records: a location
        # that declares ANY add_header inherits NONE from the level above.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # An environment that must not be indexed has no sitemap. `return` inside `if` is one of
        # the two uses of `if` in a location that are defined behaviour rather than a trap.
        if ($cf_env) { return 404; }
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>$scheme://$host/worlds</loc></url>
</urlset>';
    }

    # ---- THERE WAS A `location = /robots.txt` HERE, AND THE FOLDER MOVED IT ------------------
    #
    # A crawler reads robots.txt at the ORIGIN ROOT and nowhere else, so `<apex>/worlds/robots.txt`
    # is a file nothing ever fetches. Keeping the block would be dead configuration that READS like
    # a policy.
    #
    # Nothing to carry: this surface disallowed NOTHING. Its five route families are public, there
    # is no client-side search minting an address per `?q=`, and `/worlds/play/<title>` is where a
    # reader is meant to arrive. The `Sitemap:` line moved to micro-site, which serves the one
    # robots.txt this origin has, and the `if ($cf_env)` refusal moved with it — micro-site already
    # had an identical one, so a testnet apex answers `Disallow: /` and covers this surface by
    # construction rather than by a second copy living where nothing reads it.

    # ---- everything else -------------------------------------------------
    # A real file (favicon, the og card) is served; anything else 404s, and the error page below
    # turns that 404 into the app shell WITHOUT changing the status.
    #
    # There is no `public/robots.txt` and there must never be one: the exact-match location above
    # wins over this prefix, so such a file would be in the repository, deployed and unreachable —
    # the worst of the three states, because the next reader edits it and nothing happens.
    # test/sitemap.test.ts asserts neither file exists.
    location / {
        try_files $uri =404;
    }

    error_page 404 /worlds/index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the product works. That is Beacon's job.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
