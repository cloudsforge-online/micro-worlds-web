<!doctype html>
<!--
  data-cf-product picks the accent ramp and data-cf-substrate the ash ramp, both from
  @cloudsforge/ui/tokens.css. They are on <html> and set STATICALLY here rather than by React,
  because a page that paints before the attributes land flashes the default ember and then changes
  colour.

  'worlds' is moss, #6d9a49 — its own block in tokens.css (`ui/packages/ui/src/tokens.css`),
  and the accent the registry gives this surface (`ui/packages/ui/src/surfaces.ts`).

  'warm' is the ash ramp the brand marks in brand/assets/worlds/ are drawn on, and the one every
  other product frontend in the estate uses.

  data-cf-scheme is the third of the three, and it arrived with @cloudsforge/ui 1.1. `auto` follows
  the reader's operating system; `light` and `dark` force one. It is set here, statically, for the
  same reason the other two are — a theme flash is worse than a theme nobody asked for.

  THIS SURFACE DID CARRY A LIGHT-MODE BLOCKER AND IT IS GONE. `src/styles.css` declared
  `color-scheme: dark` on `body`, and a declaration on `body` beats the per-scheme one tokens.css
  sets on `<html>`: the page's own colours would have followed the reader into a light palette
  while every native control the browser draws — the two text inputs on the account page, the one
  on an inventory row, the scrollbars — stayed dark on it. Deleting it is what makes `auto` mean
  anything here.
-->
<html lang="en-GB" data-cf-product="worlds" data-cf-substrate="warm" data-cf-scheme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      `color-scheme`, spelled the way the standard spells it. This was `colour-scheme` — British,
      correct English, and INERT: it is not a registered meta name, no browser has ever read it, and
      the declaration meant to tell the browser which form controls and scrollbars to draw did
      nothing at all. On a surface whose account page and inventory rows are made of text inputs,
      that is not cosmetic.

      Both schemes are declared rather than only `dark`, because `data-cf-scheme="auto"` above means
      the token layer now resolves whichever palette the reader's system asks for. Declaring only
      `dark` here would leave the chrome the browser draws disagreeing with the page around it.
    -->
    <meta name="color-scheme" content="dark light" />
    <!--
      The build that produced this bundle. Stamped by the Dockerfile, read by src/lib/obs.ts, and
      the reason an error report can be pinned to the deploy that introduced it. It is an identity
      rather than a configuration: it names the artefact, it does not tell it where it is running.
    -->
    <meta name="cf-release" content="dev" />
    <!--
      THE MEASUREMENT ID, AND NOT THE ANALYTICS TAG.
      ────────────────────────────────────────────────────────────────────────────────────────
      There is deliberately no third-party `<script src=…>` anywhere in this file and there must
      never be one — the tag's own domain is not even spelled out here, so a grep for it over this
      file returns nothing and the absence is checkable rather than asserted. The stock snippet
      fetches that script and sets `_ga` on load, before any banner has been drawn let alone
      answered, and under ePrivacy Art. 5(3) an analytics cookie set before consent is a violation
      that a banner underneath it does not cure. `@cloudsforge/ui/consent` injects the tag from
      exactly one place: the Accept button in `CookieBanner`. See the header of that module.

      It is a meta tag rather than a build-time variable because test/no-build-time-config.test.ts
      greps for those and fails the build — an artefact with an environment frozen into it is not
      the artefact that passed CI. (That test greps this file too, which is why the prefix is not
      spelled out here.) It is the same mechanism `cf-release` above already uses, and the ID is an
      identity rather than a configuration: it names the property, it does not tell the bundle
      where it is running. An absent or empty value means analytics is simply off, which is what a
      local `pnpm dev` gets and is a supported mode rather than a misconfiguration.
    -->
    <meta name="cf-analytics" content="G-ZFBLKK519K" />

    <!--
      THE DESCRIPTION SAYS PLATFORM, NOT GAMES. Forge Worlds owns the title registry, one account
      across every title, inventory, achievements, seasons and the entitlement bridge. Ninety Days
      After and Emberkin run on it. A description that led with two game names would put the
      estate's own category error into every search result and every link preview.

      IT IS THE SAME SENTENCE `SURFACE_DESCRIPTION` IN src/lib/meta.ts CARRIES, and
      test/brand-chrome.test.ts compares the two byte for byte. There are two copies because they
      are read by two different things — this one by a link-preview fetcher, which does not run
      JavaScript, and that one by `applyHead` on every navigation — and the estate has already
      shipped the failure of letting such a pair drift: `site/index.html`'s title disagreed with
      its own application's for as long as it took somebody to open the served HTML rather than
      the page.

      IT IS NOT DERIVED FROM THE SURFACE REGISTRY, and that is the one deliberate departure from
      the design system's default. `surfaceMeta()` composes a description from the registry blurb,
      and `worlds`' blurb is "Ninety Days After, and what follows it" — which names a title, i.e.
      it is precisely the category error this comment exists to prevent, sitting in the registry.
      Reported upstream; overridden here rather than repeated.
    -->
    <meta
      name="description"
      content="The platform games run on: one title registry, one account across every title, the inventory it carries, the achievements and seasons titles report into, and the bridge that turns a purchase into something a title raises."
    />

    <!--
      Brand chrome for the `worlds` surface, from micro-brand's assets/worlds/ set, copied
      byte-identical — test/brand-chrome.test.ts compares the bytes in both directions.

      Like `create` and unlike `admin`, this surface DOES ship an og card: brand/assets/worlds/
      holds one (og-1200x630.png) because Forge Worlds is a public product whose title pages are
      shared outward. 18-build-status.md §3.3k drew exactly that distinction when it recorded that
      the operator console deliberately has none.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />

    <!--
      ONE og block, not two. foresight-web/index.html declares og:type, og:title and og:description
      twice — the second set silently wins in every crawler and the first is dead text nobody
      edits. Reported; not repeated here.

      The image is a RELATIVE path so the card resolves against whichever origin served the page,
      which is the same rule the rest of this bundle follows for hosts.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Forge Worlds" />
    <meta
      property="og:description"
      content="The platform games run on. One title registry, one account across every title, and the bridge between what you bought and what a title raises."
    />
    <meta property="og:image" content="/og-1200x630.png" />

    <title>Forge Worlds</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
